<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calon AI | Operational systems for service businesses that already win</title>
<link rel="stylesheet" href="styles/main.css">
<link rel="icon" href="assets/calon-logo.png">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script>
  // ─── Web3Forms — sends emails to fab@ and alom@ ────────────────────────────
  // TO ACTIVATE: go to https://web3forms.com/
  // Enter: fab@calonaisolutions.com → click "Create Access Key"
  // Check your inbox → copy the key → paste it below replacing YOUR_ACCESS_KEY
  var W3F_KEY = 'YOUR_ACCESS_KEY';

  window.sendLeadEmail = function(params) {
    var payload = {
      access_key:  W3F_KEY,
      subject:     'New ' + params.form_type + ': ' + (params.company || params.name),
      from_name:   params.company || params.name || 'Website Lead',
      replyto:     params.from_email,
      cc:          'alom@calonaisolutions.com',
      'Form type':     params.form_type,
      'Email':         params.from_email,
      'Name':          params.name || '',
      'Company':       params.company || '',
      'Annual revenue': params.revenue || '',
      'Sector':        params.sector || '',
      'Bottleneck':    params.bottleneck || '',
    };
    return fetch('https://api.web3forms.com/submit', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body:    JSON.stringify(payload),
    }).then(function(r) {
      return r.json().then(function(data) {
        if (!r.ok) throw new Error(data.message || 'Submission failed');
        return data;
      });
    });
  };
</script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react" src="components/Nav.jsx"></script>
<script type="text/babel" data-presets="react" src="components/Hero.jsx"></script>
<script type="text/babel" data-presets="react" src="components/Problem.jsx"></script>
<script type="text/babel" data-presets="react" src="components/Solution.jsx"></script>
<script type="text/babel" data-presets="react" src="components/Proof.jsx"></script>
<script type="text/babel" data-presets="react" src="components/RoadmapModal.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  const [modalOpen, setModalOpen] = React.useState(false);
  const openModal = React.useCallback(() => setModalOpen(true), []);
  const closeModal = React.useCallback(() => setModalOpen(false), []);

  React.useEffect(() => {
    const handler = (e) => {
      const el = e.target.closest('a[href="#diagnostic"], [data-open-roadmap]');
      if (el) {
        e.preventDefault();
        setModalOpen(true);
      }
    };
    document.addEventListener('click', handler);
    return () => document.removeEventListener('click', handler);
  }, []);

  const heroContent = {
    h1: <>Most service businesses don't have a sales problem. They have an <em>operational</em> one.</>,
    lead: "Calon builds the systems that recover the 40–60% of margin most £500k–£5m service firms quietly leak, without hiring more people or buying software you won't use."
  };

  return (
    <>
      <Nav />
      <Hero heroContent={heroContent} show3D={true} bgStyle="grid" />
      <TrustStrip />
      <Problem />
      <Solution />
      <Sectors />
      <Proof />
      <CTA />
      <Footer />
      <RoadmapModal open={modalOpen} onClose={closeModal} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
